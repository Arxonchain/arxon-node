[package]
name = "pallet-evm-precompile-arxon-zk"
version = "0.1.0"
license = "Unlicense"
description = "Arxon EVM precompiles 0x800 (view), 0x801 (native shield / unshield / private transfer), 0x802 (ARX-20)."
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
arxon-zk-primitives = { workspace = true }
fp-evm = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-evm = { workspace = true }
pallet-note-tree = { workspace = true }
pallet-nullifier-registry = { workspace = true }
pallet-privacy = { workspace = true }
pallet-zk-verifier = { workspace = true }
precompile-utils = { workspace = true }
scale-codec = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true, features = ["default", "insecure_zero_ed"] }
pallet-timestamp = { workspace = true, features = ["default"] }
precompile-utils = { workspace = true, features = ["testing"] }
scale-info = { workspace = true, features = ["default"] }
sp-io = { workspace = true, features = ["default"] }

[features]
default = ["std"]
std = [
	"arxon-zk-primitives/std",
	"fp-evm/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-evm/std",
	"pallet-note-tree/std",
	"pallet-nullifier-registry/std",
	"pallet-privacy/std",
	"pallet-zk-verifier/std",
	"precompile-utils/std",
	"scale-codec/std",
	"sp-core/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-evm/runtime-benchmarks",
	"pallet-note-tree/runtime-benchmarks",
	"pallet-nullifier-registry/runtime-benchmarks",
	"pallet-privacy/runtime-benchmarks",
	"pallet-zk-verifier/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-evm/try-runtime",
	"pallet-note-tree/try-runtime",
	"pallet-nullifier-registry/try-runtime",
	"pallet-privacy/try-runtime",
	"pallet-zk-verifier/try-runtime",
]

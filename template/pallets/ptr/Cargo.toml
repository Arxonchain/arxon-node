[package]
name = "pallet-ptr"
version = "0.2.0"
license = "Unlicense"
description = "Arxon private transaction receipts as commitments, opened selectively with Circuit 5 proofs (runtime index 15)."
authors = { workspace = true }
edition = { workspace = true }
homepage = "https://arxon.io"
repository = { workspace = true }
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
arxon-zk-primitives = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-privacy = { workspace = true }
pallet-zk-verifier = { workspace = true }
scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
sp-core = { workspace = true, features = ["default"] }
sp-io = { workspace = true, features = ["default"] }

[features]
default = ["std"]
std = [
	"arxon-zk-primitives/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-privacy/std",
	"pallet-zk-verifier/std",
	"scale-codec/std",
	"scale-info/std",
	"sp-io/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-privacy/runtime-benchmarks",
	"pallet-zk-verifier/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-privacy/try-runtime",
	"pallet-zk-verifier/try-runtime",
	"sp-runtime/try-runtime",
]

[package]
name = "pallet-privacy"
version = "0.2.0"
license = "Unlicense"
description = "Arxon selective privacy: shielded pool with shield, unshield and private transfers enforced by Halo2 proofs (runtime index 13)."
authors = { workspace = true }
edition = { workspace = true }
homepage = "https://arxon.io"
repository = { workspace = true }
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
arxon-zk-primitives = { workspace = true, features = ["poseidon"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
pallet-note-tree = { workspace = true }
pallet-nullifier-registry = { workspace = true }
pallet-zk-verifier = { workspace = true }
scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-runtime = { workspace = true }

[dev-dependencies]
pallet-balances = { workspace = true, features = ["default", "insecure_zero_ed"] }
sp-core = { workspace = true, features = ["default"] }
sp-io = { workspace = true, features = ["default"] }

[features]
default = ["std"]
std = [
	"arxon-zk-primitives/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"pallet-note-tree/std",
	"pallet-nullifier-registry/std",
	"pallet-zk-verifier/std",
	"scale-codec/std",
	"scale-info/std",
	"sp-runtime/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-note-tree/runtime-benchmarks",
	"pallet-nullifier-registry/runtime-benchmarks",
	"pallet-zk-verifier/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"pallet-note-tree/try-runtime",
	"pallet-nullifier-registry/try-runtime",
	"pallet-zk-verifier/try-runtime",
	"sp-runtime/try-runtime",
]

[package]
name = "pallet-note-tree"
version = "0.1.0"
license = "Unlicense"
description = "Arxon depth-32 Poseidon Merkle trees: note commitments and trust registry membership (runtime index 20)."
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
arxon-zk-primitives = { workspace = true, features = ["poseidon"] }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
scale-codec = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["default"] }
sp-io = { workspace = true, features = ["default"] }
sp-runtime = { workspace = true, features = ["default"] }

[features]
default = ["std"]
std = [
	"arxon-zk-primitives/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-codec/std",
	"scale-info/std",
	"sp-core/std",
]
runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
]

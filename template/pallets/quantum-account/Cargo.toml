[package]
name = "pallet-quantum-account"
version = "0.1.0"
authors = ["Arxon Team <dev@arxon.io>"]
edition = "2021"
license = "Unlicense"
description = "Post-quantum account layer for Arxon. ML-DSA-65 (NIST FIPS 204) signatures."
homepage = "https://arxon.io"
repository = "https://github.com/Arxonchain/arxon-node"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { workspace = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
sp-runtime = { workspace = true }

# ML-DSA-65 — NIST FIPS 204 post-quantum signatures (no_std compatible)
ml-dsa = { version = "0.1.0-rc.8", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-runtime/std",
    "frame-benchmarking?/std",
]
runtime-benchmarks = ["frame-benchmarking/runtime-benchmarks"]
try-runtime = ["frame-support/try-runtime"]

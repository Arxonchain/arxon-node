[package]
name = "arxon-zk-primitives"
version = "0.1.0"
license = "Unlicense"
description = "Arxon ZK primitives shared by the Halo2 circuits, the runtime and the EVM precompile: circuit ids, public input layouts, bundle digest, tagged Poseidon."
authors = { workspace = true }
edition = { workspace = true }
repository = { workspace = true }
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
bounded-collections = { workspace = true }
ff = { workspace = true, optional = true }
halo2_poseidon = { workspace = true, optional = true }
pasta_curves = { workspace = true, optional = true }
scale-codec = { workspace = true, features = ["max-encoded-len"] }
scale-info = { workspace = true }
sp-crypto-hashing = { workspace = true }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"bounded-collections/std",
	"ff?/std",
	"scale-codec/std",
	"scale-info/std",
	"sp-crypto-hashing/std",
]
# Native Poseidon over Pallas (no_std capable). Enabled by the circuits crate and the note-tree pallet.
poseidon = ["ff", "halo2_poseidon", "pasta_curves"]
